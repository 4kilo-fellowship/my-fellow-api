name: CD

on:
    workflow_run:
        workflows: ["CI"]
        branches: [main]
        types:
            - completed

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps:
            - uses: actions/checkout@v4

            - name: Deploy to Render
              run: |
                  curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
